name: Gloop
options:
  bundleIdPrefix: be.gloop
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Shared container for widget data. Simulator builds always get the entitlement; on a device
    # it needs the paid Apple Developer Program: set GLOOP_DEVICE_APP_GROUPS = YES in Local.xcconfig.
    GLOOP_APP_GROUP: group.be.gloop.app

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  Core:
    path: Packages/Core
  AlarmEngine:
    path: Packages/AlarmEngine
  Missions:
    path: Packages/Missions
  Features:
    path: Packages/Features
  Purchases:
    path: Packages/Purchases
  Account:
    path: Packages/Account
  Coach:
    path: Packages/Coach
  WidgetShared:
    path: Packages/WidgetShared
  Permissions:
    path: Packages/Permissions
  Buddies:
    path: Packages/Buddies
  Telemetry:
    path: Packages/Telemetry
  Localization:
    path: Packages/Localization

targets:
  Gloop:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Config/Pricing.json
        buildPhase: resources
      - path: Config/Auth.json
        buildPhase: resources
      - path: Config/CoachLines.json
        buildPhase: resources
      - path: Config/Help.json
        buildPhase: resources
      - path: Config/WhatsNew.json
        buildPhase: resources
      - path: Config/Developer.json
        buildPhase: resources
      - path: Config/SocialProof.json
        buildPhase: resources
      - path: Config/Telemetry.json
        buildPhase: resources
      - path: Config/Legal.json
        buildPhase: resources
      - path: Config/Legal
        type: folder
        buildPhase: resources
      - path: Config/Translations
        type: folder
        buildPhase: resources
      - path: Config/Quiz.json
        buildPhase: resources
      - path: Config/TongueTwisters.json
        buildPhase: resources
      - path: Config/MorningTips.json
        buildPhase: resources
    dependencies:
      - package: Core
      - package: Coach
      - package: WidgetShared
      - package: Permissions
      - package: Purchases
      - package: Account
      - package: AlarmEngine
      - package: Missions
      - package: Features
      - package: Buddies
      - package: Telemetry
      - package: Localization
      - target: AlarmLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.gloop.app
        PRODUCT_NAME: Gloop
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Mint AppIcon-Grape AppIcon-Midnight AppIcon-Gold"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Gloop
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Gloop.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(GLOOP_APP_ENTITLEMENTS_$(GLOOP_DEVICE_APP_GROUPS))
        GLOOP_APP_ENTITLEMENTS_YES: App/Gloop.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gloop
        CFBundleDevelopmentRegion: en
        # Languages with translations (keep in sync with App/Localizable.xcstrings; tested).
        CFBundleLocalizations: [en, de, es, fr, it, nl, pt-BR, pt-PT]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        GloopAppGroup: $(GLOOP_APP_GROUP)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: be.gloop.app
            CFBundleURLSchemes: [gloop]
        NSAlarmKitUsageDescription: Gloop schedules your wake-up alarms so they ring through silent mode and Focus.
        NSMicrophoneUsageDescription: Gloop uses the microphone only when you record your own alarm sound.
        NSAppleMusicUsageDescription: Gloop plays the Apple Music song you pick while you do your wake-up mission.
        NSCameraUsageDescription: Gloop uses the camera to scan the code or item you registered, so you have to get out of bed to stop the alarm. Images stay on your iPhone.

  AlarmLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AlarmLiveActivity
      # Same strings as the app (widgets, Live Activity).
      - path: App/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: AlarmEngine
      - package: Core
      - package: Coach
      - package: WidgetShared
      - package: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.gloop.app.AlarmLiveActivity
        PRODUCT_NAME: AlarmLiveActivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Extensions/AlarmLiveActivity/AlarmLiveActivity.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(GLOOP_EXT_ENTITLEMENTS_$(GLOOP_DEVICE_APP_GROUPS))
        GLOOP_EXT_ENTITLEMENTS_YES: Extensions/AlarmLiveActivity/AlarmLiveActivity.entitlements
    info:
      path: Extensions/AlarmLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Gloop Widgets
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, es, fr, it, nl, pt-BR, pt-PT]
        GloopAppGroup: $(GLOOP_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  GloopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Config/Gloop.storekit
        buildPhase: resources
    dependencies:
      - target: Gloop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.gloop.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gloop:
    build:
      targets:
        Gloop: all
        GloopTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Gloop.storekit
    test:
      config: Debug
      targets:
        - GloopTests
