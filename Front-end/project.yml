name: EarnIt
options:
  bundleIdPrefix: be.earnit
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Shared container for widget data. Simulator builds always get the entitlement; on a device
    # it needs the paid Apple Developer Program: set EARNIT_DEVICE_APP_GROUPS = YES in Local.xcconfig.
    EARNIT_APP_GROUP: group.be.earnit.app

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  Core:
    path: Packages/Core
  AlarmEngine:
    path: Packages/AlarmEngine
  Missions:
    path: Packages/Missions
  Features:
    path: Packages/Features
  Purchases:
    path: Packages/Purchases
  Account:
    path: Packages/Account
  Coach:
    path: Packages/Coach
  WidgetShared:
    path: Packages/WidgetShared

targets:
  EarnIt:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Config/Pricing.json
        buildPhase: resources
      - path: Config/Auth.json
        buildPhase: resources
      - path: Config/CoachLines.json
        buildPhase: resources
    dependencies:
      - package: Core
      - package: Coach
      - package: WidgetShared
      - package: Purchases
      - package: Account
      - package: AlarmEngine
      - package: Missions
      - package: Features
      - target: AlarmLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.earnit.app
        PRODUCT_NAME: EarnIt
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Earn It
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/EarnIt.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(EARNIT_APP_ENTITLEMENTS_$(EARNIT_DEVICE_APP_GROUPS))
        EARNIT_APP_ENTITLEMENTS_YES: App/EarnIt.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Earn It
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        EarnItAppGroup: $(EARNIT_APP_GROUP)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: be.earnit.app
            CFBundleURLSchemes: [earnit]
        NSAlarmKitUsageDescription: Earn It schedules your wake-up alarms so they ring through silent mode and Focus.
        NSMicrophoneUsageDescription: Earn It uses the microphone only when you record your own alarm sound.
        NSAppleMusicUsageDescription: Earn It plays the Apple Music song you pick while you do your wake-up mission.
        NSCameraUsageDescription: Earn It uses the camera to scan the code or item you registered, so you have to get out of bed to stop the alarm. Images stay on your iPhone.

  AlarmLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AlarmLiveActivity
      - path: App/CoachArt.xcassets
    dependencies:
      - package: AlarmEngine
      - package: Core
      - package: Coach
      - package: WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.earnit.app.AlarmLiveActivity
        PRODUCT_NAME: AlarmLiveActivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Extensions/AlarmLiveActivity/AlarmLiveActivity.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(EARNIT_EXT_ENTITLEMENTS_$(EARNIT_DEVICE_APP_GROUPS))
        EARNIT_EXT_ENTITLEMENTS_YES: Extensions/AlarmLiveActivity/AlarmLiveActivity.entitlements
    info:
      path: Extensions/AlarmLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Earn It Widgets
        EarnItAppGroup: $(EARNIT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  EarnItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Config/EarnIt.storekit
        buildPhase: resources
    dependencies:
      - target: EarnIt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.earnit.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EarnIt:
    build:
      targets:
        EarnIt: all
        EarnItTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/EarnIt.storekit
    test:
      config: Debug
      targets:
        - EarnItTests
