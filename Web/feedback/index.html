<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Gloop feedback board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
          integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil"
          crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand">
        <svg class="blob" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFB84D"/><stop offset="1" stop-color="#F56B1A"/>
            </linearGradient>
          </defs>
          <path fill="url(#g)" d="M32 6c14 0 24 12 24 27 0 12-6 21-14 23-3 1-4-2-7-2s-4 3-7 2C14 54 8 45 8 33 8 18 18 6 32 6z"/>
          <circle cx="24" cy="30" r="4" fill="#3A2210"/><circle cx="40" cy="30" r="4" fill="#3A2210"/>
          <path d="M26 40q6 5 12 0" stroke="#3A2210" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <h1 data-i18n="heading">Ideas for Gloop</h1>
      </div>
      <div id="account" class="account" hidden></div>
    </header>

    <p class="intro" data-i18n="intro"></p>

    <section id="signin" class="card signin" hidden>
      <h2 data-i18n="signin_heading"></h2>
      <p class="muted" data-i18n="signin_text"></p>
      <div class="oauth">
        <button type="button" class="btn secondary" data-provider="apple"></button>
        <button type="button" class="btn secondary" data-provider="google"></button>
      </div>
      <form id="signin-form" class="stack">
        <label><span data-i18n="email"></span><input type="email" name="email" autocomplete="email" required></label>
        <label><span data-i18n="password"></span><input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn primary" data-i18n="signin"></button>
        <p class="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="board" hidden>
      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-sort="top" data-i18n="tab_top"></button>
          <button type="button" role="tab" data-sort="new" data-i18n="tab_new"></button>
        </div>
        <input id="search" type="search" class="search" data-i18n-placeholder="search_placeholder">
      </div>
      <div id="chips" class="chips"></div>
      <button type="button" id="suggest" class="btn primary wide" data-i18n="suggest"></button>
      <p id="status" class="status muted" role="status"></p>
      <ol id="list" class="list"></ol>
      <button type="button" id="more" class="btn secondary wide" data-i18n="load_more" hidden></button>
    </section>

    <footer class="foot">
      <button type="button" class="link" data-legal="community" data-i18n="community"></button>
      <span aria-hidden="true">·</span>
      <button type="button" class="link" data-legal="privacy" data-i18n="privacy"></button>
    </footer>
  </main>

  <dialog id="form-dialog" class="sheet">
    <form id="post-form" method="dialog" class="stack">
      <h2 data-i18n="form_heading"></h2>
      <label><span data-i18n="form_title"></span>
        <input name="title" maxlength="80" required data-i18n-placeholder="form_title_placeholder">
        <small class="counter" data-for="title"></small>
      </label>
      <div id="similar" class="similar" hidden></div>
      <label><span data-i18n="form_body"></span>
        <textarea name="body" rows="4" maxlength="1000" data-i18n-placeholder="form_body_placeholder"></textarea>
        <small class="counter" data-for="body"></small>
      </label>
      <label><span data-i18n="form_category"></span><select name="category"></select></label>
      <p class="consent muted" id="consent"></p>
      <p class="error" role="alert" hidden></p>
      <div class="row end">
        <button type="button" class="btn secondary" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="post"></button>
      </div>
    </form>
  </dialog>

  <dialog id="report-dialog" class="sheet">
    <form id="report-form" method="dialog" class="stack">
      <h2 data-i18n="report_heading"></h2>
      <label><span data-i18n="report_reason"></span><textarea name="reason" rows="3" maxlength="500"></textarea></label>
      <div class="row end">
        <button type="button" class="btn secondary" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="report_send"></button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="sheet">
    <form id="delete-form" method="dialog" class="stack">
      <h2 data-i18n="delete_heading"></h2>
      <p class="muted" data-i18n="delete_text"></p>
      <div class="row end">
        <button type="button" class="btn secondary" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn danger" data-i18n="delete"></button>
      </div>
    </form>
  </dialog>

  <dialog id="legal-dialog" class="sheet legal">
    <div class="legal-body"></div>
    <div class="row end"><button type="button" class="btn secondary" data-close data-i18n="close"></button></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
